# SelfHealingPlaywrightFramework — Playwright CI
# Dashboard ingest: plain curl multipart (no JSON-only fallback). See docs/dashboard-ingest.md

name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      BASE_URL: "https://retail-website-fawn.vercel.app"
      # Keep showcase run green; demo failure injection disabled.
      DEMO_DASHBOARD_FAILURES: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (with OS deps)
        run: npx playwright install --with-deps chromium

      # Do not pass --reporter here: it overrides playwright.config.ts and drops
      # json.outputFile, so playwright-report/results.json is never written.
      - name: Run Playwright tests
        run: npx playwright test --grep "@static-healing-showcase|@auto-heal-discovery-showcase|@dom-scan-healing-showcase"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # test-results/ is gitignored. upload-artifact@v4 matches paths with gitignore rules, so a direct
      # path of test-results/ can upload 0 files even when traces exist on disk — zip first, then upload the zip.
      - name: Package test-results for artifact (if any)
        id: test_results_pkg
        if: always()
        run: |
          rm -f test-results-upload.zip
          if find test-results -type f -print -quit 2>/dev/null | grep -q .; then
            ( cd test-results && zip -qr ../test-results-upload.zip . )
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test results (traces, screenshots)
        if: always() && steps.test_results_pkg.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results-upload.zip
          retention-days: 7

      - name: Warm dashboard API (Render cold start)
        if: always()
        continue-on-error: true
        env:
          DASHBOARD_URL: https://realtime-testing-dashboard.onrender.com
        run: |
          echo "GET $DASHBOARD_URL/api/health (wake sleeping instance)"
          curl -sS -w "\nHTTP %{http_code}\n" --connect-timeout 10 --max-time 120 "$DASHBOARD_URL/api/health" || true

      # One HTTP call: multipart with payload (JSON file) + report_zip (zip). No Node fetch / no fallback to /run.
      - name: Publish results to dashboard (multipart curl)
        if: always()
        continue-on-error: true
        env:
          DASHBOARD_URL: https://realtime-testing-dashboard.onrender.com
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          SUITE_NAME: SelfHealing Playwright
          ENVIRONMENT: CI
          BUILD_VERSION: ${{ github.sha }}
          DASHBOARD_MAX_TIME_SEC: "90"
          DASHBOARD_POST_RETRIES: "3"
          DASHBOARD_POST_RETRY_DELAY_SEC: "5"
        run: |
          set -uo pipefail
          DASHBOARD_URL="${DASHBOARD_URL%/}"
          if [ -z "${DASHBOARD_INGEST_TOKEN:-}" ]; then
            echo "DASHBOARD_INGEST_TOKEN not set — skip dashboard ingest"
            exit 0
          fi
          if [ ! -f playwright-report/results.json ] || [ ! -f playwright-report/index.html ]; then
            echo "Missing playwright-report/results.json or index.html — skip dashboard ingest"
            exit 0
          fi

          node scripts/build-dashboard-payload.mjs playwright-report/results.json payload.json
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("payload.json","utf8"));console.log(`[dashboard] payload summary: suite_name="${p.suite_name}", environment="${p.environment}", build_version="${p.build_version}", test_cases=${Array.isArray(p.test_cases)?p.test_cases.length:0}`)'
          # Slim zip: traces/videos hang Render uploads (100 Continue timeout).
          ( cd playwright-report && zip -qr ../report.zip . -x '*trace*' '*.zip' '*.webm' '*.mp4' )

          ZIP_BYTES=$(wc -c < report.zip | tr -d ' ')
          echo "[dashboard] report.zip size=${ZIP_BYTES} bytes"
          echo "[dashboard] DASHBOARD_URL=${DASHBOARD_URL}"
          URL="${DASHBOARD_URL}/api/ingest/github-actions/run-with-report"
          JSON_URL="${DASHBOARD_URL}/api/ingest/github-actions/run"
          echo ""
          echo "========== Dashboard ingest (check this log) =========="
          echo "POST ${JSON_URL} then ${URL}"
          echo "========================================================"

          echo "[dashboard] Waiting for API health..."
          for i in 1 2 3 4 5 6; do
            set +e
            HEALTH=$(curl -4 --http1.1 -sS --connect-timeout 15 --max-time 60 -o /dev/null -w '%{http_code}' "${DASHBOARD_URL}/api/health")
            set -e
            echo "[dashboard] health attempt ${i}: HTTP ${HEALTH}"
            if [ "$HEALTH" = "200" ]; then
              break
            fi
            sleep 8
          done

          MAXT="${DASHBOARD_MAX_TIME_SEC:-90}"
          HDR=$(mktemp)
          BODY=$(mktemp)
          cleanup() { rm -f "$HDR" "$BODY"; }
          trap cleanup EXIT

          post_zip() {
            curl -4 --http1.1 -sS --connect-timeout 20 --max-time "$MAXT" \
              -H "Expect:" \
              -H "X-Ingest-Token: ${DASHBOARD_INGEST_TOKEN}" \
              -X POST "$URL" \
              -D "$HDR" -o "$BODY" \
              -F "payload=@payload.json;type=application/json" \
              -F "report_zip=@report.zip;type=application/zip" \
              -w '%{http_code}'
          }

          post_json() {
            curl -4 --http1.1 -sS --connect-timeout 20 --max-time 60 \
              -H "Expect:" \
              -H "Content-Type: application/json" \
              -H "X-Ingest-Token: ${DASHBOARD_INGEST_TOKEN}" \
              -X POST "$JSON_URL" \
              -D "$HDR" -o "$BODY" \
              --data-binary @payload.json \
              -w '%{http_code}'
          }

          echo "[dashboard] POST JSON (KPIs)"
          set +e
          HTTP_CODE="$(post_json)"
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "[dashboard] JSON ingest OK (http ${HTTP_CODE})"
            cat "$BODY"
          else
            echo "[dashboard] JSON ingest failed (exit ${CURL_EXIT}, http ${HTTP_CODE})"
            if [ -s "$HDR" ]; then cat "$HDR"; fi
            if [ -s "$BODY" ]; then cat "$BODY"; fi
            echo "[dashboard] WARN: continuing workflow despite ingest failure"
            exit 0
          fi

          echo "[dashboard] POST zip (HTML report)"
          set +e
          HTTP_CODE="$(post_zip)"
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "[dashboard] Zip ingest OK (http ${HTTP_CODE})"
            cat "$BODY"
            exit 0
          fi
          echo "[dashboard] Zip ingest failed (KPIs already posted). exit ${CURL_EXIT} http ${HTTP_CODE}"
          exit 0
