# SelfHealingPlaywrightFramework — Playwright CI
# Dashboard ingest: plain curl multipart (no JSON-only fallback). See docs/dashboard-ingest.md

name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  # Required for Real-Time Testing Dashboard → "CI pipeline control" → Run pipeline
  # (Render API calls GitHub workflow_dispatch with GITHUB_CI_TOKEN).
  workflow_dispatch:

jobs:
  test:
    name: Run tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CI: "true"
      BASE_URL: "https://retail-website-fawn.vercel.app"
      AUTO_HEAL_DISCOVER: "1"
      HEALING_AGENT_MODE: "agentic"
      PW_USE_SYSTEM_CHROME: "0"
      # Keep showcase run green; demo failure injection disabled.
      DEMO_DASHBOARD_FAILURES: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (with OS deps)
        run: npx playwright install --with-deps chromium

      - name: Build and start healing-service (unit tests)
        env:
          HEALING_LLM_PROVIDER: mock
        run: |
          set -euo pipefail
          npm run build:healing-service
          npm run start -w healing-service &
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3921/health >/dev/null; then
              echo "healing-service ready"
              exit 0
            fi
            sleep 2
          done
          echo "healing-service failed to start"
          exit 1

      - name: Run unit tests (healing stack)
        env:
          HEALING_SERVICE_URL: http://localhost:3921
        run: npm run test:unit

      - name: Run healing demo (must prove auto-heal)
        run: npm run install:plug-and-play-demo && npm test --prefix examples/playwright-plug-and-play -- --grep @healing-demo

      # Snapshot healing report before live-login overwrites playwright-report/.
      - name: Keep healing-demo report for dashboard
        if: always()
        run: |
          set -euo pipefail
          SRC=examples/playwright-plug-and-play/playwright-report
          DEST=examples/playwright-plug-and-play/dashboard-report
          rm -rf "$DEST"
          mkdir -p "$DEST"
          if [ -f "$SRC/results.json" ] && [ -f "$SRC/index.html" ]; then
            cp -a "$SRC"/. "$DEST"/
            echo "Saved healing-demo HTML report for dashboard ingest"
          else
            echo "Healing-demo report missing — dashboard ingest will fail"
            exit 1
          fi

      # Live Vercel login can flake independently of healing; do not block CI green.
      - name: Run live login demos (non-blocking)
        continue-on-error: true
        run: npm test --prefix examples/playwright-plug-and-play -- --grep @live-login

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: examples/playwright-plug-and-play/playwright-report/
          retention-days: 7

      # test-results/ is gitignored. upload-artifact@v4 matches paths with gitignore rules, so a direct
      # path of test-results/ can upload 0 files even when traces exist on disk — zip first, then upload the zip.
      - name: Package test-results for artifact (if any)
        id: test_results_pkg
        if: always()
        run: |
          rm -f test-results-upload.zip
          TR_DIR="examples/playwright-plug-and-play/test-results"
          if find "$TR_DIR" -type f -print -quit 2>/dev/null | grep -q .; then
            ( cd "$TR_DIR" && zip -qr ../../../test-results-upload.zip . )
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test results (traces, screenshots)
        if: always() && steps.test_results_pkg.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results-upload.zip
          retention-days: 7

      - name: Publish results to dashboard (Action logs)
        if: always()
        env:
          DASHBOARD_URL: https://realtime-testing-dashboard-api-ld7t.onrender.com
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          SUITE_NAME: SelfHealing Playwright
          ENVIRONMENT: CI
          BUILD_VERSION: ${{ github.sha }}
          REPORT_DIR: examples/playwright-plug-and-play/dashboard-report
        run: bash scripts/ci-dashboard-ingest.sh
